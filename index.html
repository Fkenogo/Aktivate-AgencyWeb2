
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKTIVATE | Brand & Advertising Agency in Burundi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandTeal: '#1AB69D',
            deepBlack: '#0A0A0A',
            charcoalGrey: '#2D2D2D',
            lightGrey: '#F5F5F5',
            hoverTeal: '#158F7C',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            montserrat: ['Montserrat', 'sans-serif'],
          },
          maxWidth: {
            'content': '1440px',
          },
          spacing: {
            '120': '120px',
            '80': '80px',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --brand-teal: #1AB69D;
      --deep-black: #0A0A0A;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      color: var(--deep-black);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 {
      font-family: 'Montserrat', sans-serif;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--brand-teal);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #158F7C;
    }

    /* Tooltip Styles */
    [data-tooltip] {
      position: relative;
      cursor: pointer;
    }
    [data-tooltip]::before {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      padding: 6px 12px;
      background-color: var(--deep-black);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      border-radius: 4px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
      z-index: 50;
      font-family: 'Inter', sans-serif;
      pointer-events: none;
    }
    [data-tooltip]:hover::before {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(-12px);
    }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .animate-fadeInUp { animation: fadeInUp 0.6s ease-out forwards; }
    .animate-fadeIn { animation: fadeIn 0.8s ease forwards; }
    
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }

    /* Page Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: #0A0A0A;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }
    .loader-content {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-style: italic;
      color: #1AB69D;
      font-size: 2.5rem;
      letter-spacing: -0.05em;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* Glass Effects */
    .glass-header {
      backdrop-filter: blur(12px);
      background-color: rgba(255, 255, 255, 0.85);
    }

    /* Wave animation for loading */
    @keyframes wave {
      0%, 100% { clip-path: polygon(0% 45%, 16% 44%, 33% 50%, 54% 60%, 70% 61%, 84% 59%, 100% 52%, 100% 100%, 0% 100%); }
      50% { clip-path: polygon(0% 60%, 15% 65%, 34% 66%, 51% 62%, 67% 50%, 84% 45%, 100% 46%, 100% 100%, 0% 100%); }
    }
    .loading-wave {
      animation: wave 3s ease-in-out infinite;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "react-helmet": "https://esm.sh/react-helmet@6.1.0",
    "@google/genai": "https://esm.sh/@google/genai@^0.2.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
  <div id="loader">
    <div class="loader-content">AKTIVATE</div>
  </div>
  <div id="root"></div>
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }, 500);
    });

    const observerOptions = { threshold: 0.15 };
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
        }
      });
    }, observerOptions);

    const setupObservers = () => {
      document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
    };

    window.addEventListener('DOMContentLoaded', setupObservers);
    const mutationObserver = new MutationObserver(setupObservers);
    mutationObserver.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
