
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKTIVATE | Brand & Advertising Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        h1, h2, h3, h4, .font-heading {
            font-family: 'Montserrat', sans-serif;
        }
        .text-brand-teal { color: #1AB69D; }
        .bg-brand-teal { background-color: #1AB69D; }
        .border-brand-teal { border-color: #1AB69D; }
        .hover-bg-brand-teal:hover { background-color: #158F7C; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #1AB69D;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #158F7C;
        }

        /* Infinite Scroll Animation */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-250px * 8 - 2rem * 8)); }
        }

        .animate-marquee {
            animation: scroll 30s linear infinite;
        }

        .animate-marquee:hover {
            animation-play-state: paused;
        }

        /* Fade In Up with Bounce */
        @keyframes fadeInUpBounce {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            60% {
                opacity: 1;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-fade-in-up-bounce {
            animation: fadeInUpBounce 800ms cubic-bezier(0.34, 1.56, 0.64, 1) 200ms both;
        }

        .animate-fade-in {
            animation: fadeIn 300ms ease-out forwards;
        }

        .animate-scale-in {
            animation: scaleIn 300ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="bg-white text-[#0A0A0A] overflow-x-hidden">
    <div id="root"></div>
</body>
</html>
